<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ t('login.title') }}</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c8a84b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arma Panel">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<div class="login-box">
  <div class="corner"></div>
  <div class="tag">&#9632; {{ t('common.panel_tag') }}</div>
  <h1>ARMA <span>REFORGER</span></h1>
  <div class="field">
    <label for="pwd">{{ t('login.password_label') }}</label>
    <input type="password" id="pwd" placeholder="{{ t('login.password_placeholder') }}" autofocus />
  </div>
  <button class="btn" id="btn-login">{{ t('login.submit') }}</button>
  <div class="error" id="err"></div>
  {% include 'partials/lang_switch.html' %}
</div>
{% include 'partials/i18n_data.html' %}
<script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
