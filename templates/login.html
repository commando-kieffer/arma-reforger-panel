<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ t('login.title') }}</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arma Panel">
<link rel="apple-touch-icon" href="/static/icon-192.png">
{% with page_css = 'login.css' %}{% include 'partials/theme_head.html' %}{% endwith %}
</head>
<body>
<main class="connection">
  <div class="login-box">
    <div class="login-head">
      <div class="login-logo">
        <img src="{{ url_for('static', filename='img/logo-ck.png') }}" alt="{{ t('common.logo_alt') }}">
      </div>
      <form class="login-form" id="login-form">
        <div class="login-tag">{{ t('common.panel_tag') }}</div>
        <h1 class="login-title">Arma Reforger</h1>
        <div class="field">
          <label for="pwd">{{ t('login.password_label') }}</label>
          <input type="password" id="pwd" placeholder="{{ t('login.password_placeholder') }}" autocomplete="current-password" autofocus />
        </div>
        <button type="submit" class="btn btn-light" id="btn-login">{{ t('login.submit') }}</button>
        <p class="error" id="err" role="alert"></p>
      </form>
    </div>
    <div class="login-foot">
      {% include 'partials/lang_switch.html' %}
    </div>
  </div>
</main>
{% include 'partials/i18n_data.html' %}
<script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
